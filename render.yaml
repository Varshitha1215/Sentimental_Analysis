services:
  # Frontend Service
  - type: web
    name: sentiment-analysis-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: REACT_APP_API_URL
        value: https://sentiment-analysis-backend.onrender.com/api
    routes:
      - path: /
        destination: /

  # Backend Service
  - type: web
    name: sentiment-analysis-backend
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: "5000"
      - key: PYTHON_SERVICE_URL
        value: https://sentiment-analysis-python.onrender.com
      - key: MONGODB_URI
        value: mongodb://localhost:27017/sentiment_analysis
    routes:
      - path: /api
        destination: /api

  # Python Engine Service
  - type: web
    name: sentiment-analysis-python
    runtime: python-3.11
    buildCommand: cd python-engine && pip install -r requirements.txt
    startCommand: cd python-engine && uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: WORKERS
        value: "4"
